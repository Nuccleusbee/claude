name: Build RelicPvP

on:
  push:
    paths: ["relicpvp/**", ".github/workflows/relicpvp.yml"]
  pull_request:
    paths: ["relicpvp/**", ".github/workflows/relicpvp.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relicpvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RelicPvP-jar
          path: relicpvp/build/libs/*.jar
