# ============================================================
#  RelicPvP config
#  Text uses MiniMessage: <red>, <gold>, <bold>, <gradient:red:gold>...
#  Item references (anywhere you see "item:") can be either a vanilla
#  material (DIAMOND, IRON_INGOT...) or an id from the "items" section.
#  After editing, run /relic reload
# ============================================================

prefix: "<dark_gray>[<gold>Relic</gold>]</dark_gray> "

# ------------------------------------------------------------
# World layout for /relic createworld (centred on 0,0):
#   spawn plains -> 4 mega biomes (N/E/S/W wedges) -> wasteland ring -> world border
# Biome names: https://minecraft.wiki/w/Biome#Biome_IDs  (e.g. ice_spikes, jungle,
# badlands, cherry_grove, mushroom_fields, dark_forest, snowy_taiga, desert, savanna)
# Changing this only affects chunks that haven't been generated yet.
# ------------------------------------------------------------
world-layout:
  spawn-radius: 120
  biome-radius: 1200
  wasteland-radius: 2400
  spawn-biome: plains
  biomes:
    north: snowy_taiga
    east: jungle
    south: desert
    west: dark_forest
  wasteland-biome: badlands

# Size of the plaza /relic createworld and /relic buildspawn build.
spawn-plaza-radius: 28

# ------------------------------------------------------------
# The Wasteland: everything past world-layout.biome-radius.
# Custom monsters keep spawning around players out there and hunt
# them, and rare loot keeps dropping near them.
# ------------------------------------------------------------
wasteland:
  enabled: true
  world: relic
  # Instead of the radius you can use a zone you made: zone: wasteland
  zone: ""
  monsters:
    spawn-every-seconds: 5
    max-per-player: 7
    spawn-distance-min: 16
    spawn-distance-max: 32
    # How far they'll chase you.
    chase-range: 48
    types:
      ash_ghoul:
        name: "<gray>Ash Ghoul"
        entity: HUSK
        health: 35
        damage-multiplier: 1.4
        speed-multiplier: 1.35
        weight: 40
        exp: 8
        equipment: {helmet: CHAINMAIL_HELMET, main-hand: STONE_AXE}
        drops:
          bone: {item: BONE, amount: 2, chance: 0.6}
          iron: {item: IRON_INGOT, amount: 1, chance: 0.2}
      cinder_stalker:
        name: "<dark_red>Cinder Stalker"
        entity: SPIDER
        health: 30
        damage-multiplier: 1.5
        speed-multiplier: 1.4
        weight: 25
        exp: 10
        drops:
          string: {item: STRING, amount: 3, chance: 0.7}
      dust_archer:
        name: "<gold>Dust Archer"
        entity: STRAY
        health: 30
        damage-multiplier: 1.3
        speed-multiplier: 1.1
        weight: 20
        exp: 12
        equipment: {main-hand: BOW, helmet: LEATHER_HELMET}
        drops:
          arrows: {item: ARROW, amount: 8, chance: 0.6}
      scrap_brute:
        name: "<red><bold>Scrap Brute"
        entity: VINDICATOR
        health: 70
        damage-multiplier: 1.6
        speed-multiplier: 1.2
        weight: 10
        exp: 30
        equipment: {main-hand: IRON_AXE}
        drops:
          gold: {item: GOLD_INGOT, amount: 4, chance: 0.8}
          totem: {item: ash_totem, amount: 1, chance: 0.05}
      wasteland_ravager:
        name: "<dark_red><bold>Dune Ravager"
        entity: RAVAGER
        health: 160
        damage-multiplier: 1.3
        speed-multiplier: 1.1
        weight: 3
        exp: 80
        drops:
          diamonds: {item: DIAMOND, amount: 4, chance: 1.0}
          blade: {item: scorch_blade, amount: 1, chance: 0.1}
  loot:
    # Every this many seconds, a rare item drops near a random player in the wasteland.
    spawn-every-seconds: 60
    distance-min: 20
    distance-max: 60
    table:
      crown:
        item: wasteland_crown
        amount: 1
        weight: 3
        announce: "<gradient:dark_red:gold><bold>LEGENDARY!</bold></gradient> <yellow>The Crown of Ash glints nearby"
      scorch:
        item: scorch_blade
        amount: 1
        weight: 10
        announce: "<light_purple><bold>EPIC!</bold></light_purple> <yellow>Scorchfang has surfaced nearby"
      totem:
        item: ash_totem
        amount: 1
        weight: 20
        announce: "<yellow>An Ash Totem has turned up nearby"
      gapple:
        item: phoenix_apple
        amount: 1
        weight: 25
        announce: "<red>A Phoenix Apple has fallen nearby"
      netherite:
        item: NETHERITE_SCRAP
        amount: 2
        weight: 42
        announce: "<gray>Some netherite scrap is lying nearby"

# ------------------------------------------------------------
# Custom items. Used by kits, bosses, generators and rare spawns.
# ------------------------------------------------------------
items:
  starter_blade:
    material: STONE_SWORD
    name: "<gray>Starter Blade"
    lore: ["<dark_gray>Everyone starts somewhere."]
    unbreakable: true
  blade_of_dawn:
    material: DIAMOND_SWORD
    name: "<gradient:gold:yellow><bold>Blade of Dawn</gradient>"
    lore: ["<gold>Legendary", "<gray>Found only by the lucky."]
    enchants: {sharpness: 6, fire_aspect: 2, unbreaking: 3}
    glow: true
  void_bow:
    material: BOW
    name: "<dark_purple><bold>Void Bow"
    lore: ["<light_purple>Epic"]
    enchants: {power: 5, punch: 2, infinity: 1}
  phoenix_apple:
    material: ENCHANTED_GOLDEN_APPLE
    name: "<red>Phoenix Apple"
    lore: ["<yellow>Rare"]
  reaper_scythe:
    material: NETHERITE_HOE
    name: "<dark_red><bold>Reaper's Scythe"
    lore: ["<red>Boss drop"]
    enchants: {sharpness: 8, knockback: 2}
    unbreakable: true
    glow: true
  wasteland_crown:
    material: NETHERITE_HELMET
    name: "<gradient:dark_red:gold><bold>Crown of Ash</gradient>"
    lore: ["<gold>Legendary", "<gray>Only found in the Wasteland."]
    enchants: {protection: 5, unbreaking: 3, thorns: 2}
    glow: true
  scorch_blade:
    material: NETHERITE_SWORD
    name: "<red><bold>Scorchfang"
    lore: ["<light_purple>Epic", "<gray>Still warm."]
    enchants: {sharpness: 6, fire_aspect: 3}
  ash_totem:
    material: TOTEM_OF_UNDYING
    name: "<dark_gray><bold>Ash Totem"
    lore: ["<yellow>Rare"]
  warlord_axe:
    material: NETHERITE_AXE
    name: "<aqua><bold>Warlord's Axe"
    lore: ["<dark_aqua>Boss drop"]
    enchants: {sharpness: 7, efficiency: 5}
    unbreakable: true

# ------------------------------------------------------------
# Starter kit. Format per line: "<item> [amount]"
# Armor goes straight into the armor slots if they're empty.
# ------------------------------------------------------------
kit:
  give-on-first-join: true
  give-on-respawn: true
  # Kit items vanish on death instead of dropping (stops kit farming).
  remove-kit-items-on-death: true
  items:
    - "starter_blade"
    - "BOW"
    - "ARROW 32"
    - "LEATHER_HELMET"
    - "LEATHER_CHESTPLATE"
    - "LEATHER_LEGGINGS"
    - "LEATHER_BOOTS"
    - "COOKED_BEEF 16"

# ------------------------------------------------------------
# Level keys. Bosses drop them; right-click one to unlock that level.
# ------------------------------------------------------------
keys:
  material: TRIPWIRE_HOOK
  name: "<gold><bold>Level {tier} Key"
  lore:
    - "<gray>Right-click to unlock <yellow>Level {tier}</yellow>."
  # true = you must unlock levels in order (need level 2 before a level 3 key works)
  require-previous-level: true
  # true = key goes straight into the top damager's inventory.
  # false = it drops on the ground (fight for it!)
  give-to-top-damager: true

# ------------------------------------------------------------
# Generators (create them in-game with /relic gen create)
# ------------------------------------------------------------
generators:
  # Only generate when a player is this close (stops item lag).
  activation-range: 32
  # Stop dropping when this many of the item are already lying there.
  max-on-ground: 64

# ------------------------------------------------------------
# Block generators (create them in-game with /generator)
# Mine them forever; drops go straight into your inventory,
# even inside no-build zones like spawn.
# ------------------------------------------------------------
block-generators:
  # Seconds before a mined block comes back. 0 = it never breaks at all.
  default-regen-seconds: 0
  # What the block turns into while it's regenerating.
  placeholder: BEDROCK

# ------------------------------------------------------------
# Bosses. Set where they live with /relic boss setspawn <id>.
# They spawn when a player comes near and respawn after dying.
# ------------------------------------------------------------
boss-bar-range: 48
bosses:
  grave_knight:
    name: "<red><bold>Grave Knight"
    entity: ZOMBIE
    health: 300
    damage-multiplier: 1.5
    key-tier: 1
    respawn-seconds: 300
    leash-radius: 30
    exp: 200
    bar-color: RED
    announce-spawn: true
    equipment:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      main-hand: IRON_SWORD
    abilities:
      shockwave: {every-seconds: 15, radius: 5, damage: 4}
    drops:
      gold: {item: GOLD_INGOT, amount: 16, chance: 1.0}
      apple: {item: phoenix_apple, amount: 1, chance: 0.25}

  ashen_reaper:
    name: "<dark_red><bold>Ashen Reaper"
    entity: WITHER_SKELETON
    health: 600
    damage-multiplier: 2.0
    key-tier: 2
    respawn-seconds: 600
    leash-radius: 30
    exp: 500
    bar-color: PURPLE
    announce-spawn: true
    equipment:
      helmet: NETHERITE_HELMET
      main-hand: reaper_scythe
    abilities:
      shockwave: {every-seconds: 12, radius: 6, damage: 6}
      minions: {every-seconds: 25, entity: WITHER_SKELETON, count: 2}
    drops:
      diamonds: {item: DIAMOND, amount: 8, chance: 1.0}
      scythe: {item: reaper_scythe, amount: 1, chance: 0.1}

  ironclad_warlord:
    name: "<aqua><bold>Ironclad Warlord"
    entity: VINDICATOR
    health: 1000
    damage-multiplier: 2.5
    key-tier: 3
    respawn-seconds: 900
    leash-radius: 35
    exp: 1000
    bar-color: BLUE
    announce-spawn: true
    equipment:
      helmet: NETHERITE_HELMET
      chestplate: NETHERITE_CHESTPLATE
      main-hand: warlord_axe
    abilities:
      shockwave: {every-seconds: 10, radius: 7, damage: 8}
      minions: {every-seconds: 20, entity: VINDICATOR, count: 3}
    drops:
      netherite: {item: NETHERITE_INGOT, amount: 2, chance: 1.0}
      axe: {item: warlord_axe, amount: 1, chance: 0.1}

# ------------------------------------------------------------
# Rare item spawns. Add spawn points around the map with
# /relic rare addpoint. Every interval a random point gets a
# glowing rare item and the whole server is told.
# ------------------------------------------------------------
rare-spawns:
  interval-seconds: 300
  despawn-seconds: 180
  max-active: 3
  min-players-online: 1
  # How much of the location to reveal: zone, coords, both, none
  reveal: zone
  table:
    dawn:
      item: blade_of_dawn
      amount: 1
      weight: 5
      announce: "<gold><bold>LEGENDARY!</bold></gold> <yellow>A Blade of Dawn has appeared"
    void_bow:
      item: void_bow
      amount: 1
      weight: 15
      announce: "<light_purple><bold>EPIC!</bold></light_purple> <yellow>A Void Bow has appeared"
    apple:
      item: phoenix_apple
      amount: 1
      weight: 30
      announce: "<red>A Phoenix Apple has appeared"
    diamonds:
      item: DIAMOND
      amount: 5
      weight: 50
      announce: "<aqua>A stash of diamonds has appeared"
